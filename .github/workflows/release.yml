name: Build & Release Extension

# Runs automatically whenever you push a tag like v1.0.0, v1.0.1, etc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Zip the dist folder
        run: cd dist && zip -r ../aurora-clock-extension.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aurora-clock-extension.zip
          generate_release_notes: true
